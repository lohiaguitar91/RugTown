<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a120c">
<title>Rug Town — carpet-cam spike</title>
<style>
  :root{
    --sa-top:env(safe-area-inset-top,0px); --sa-bottom:env(safe-area-inset-bottom,0px);
    --sa-left:env(safe-area-inset-left,0px); --sa-right:env(safe-area-inset-right,0px);
  }
  html,body{margin:0;height:100%;background:#1a120c;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:pointer;
         -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  pre{color:#eee;font:12px monospace;padding:8px;position:absolute;top:0;left:0;background:rgba(0,0,0,.6);max-width:100vw;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="out" hidden></pre>
<script>
  // Surface errors on-page — this spike gets tested on phones without devtools.
  window.onerror = function (msg, src, line, col) {
    var out = document.getElementById('out');
    out.hidden = false;
    out.textContent = 'ERROR: ' + msg + ' @' + line + ':' + col;
    document.title = out.textContent;
  };
</script>
<script src="audio.js"></script>
<script src="build.js"></script>
<script src="main.js"></script>
</body>
</html>
